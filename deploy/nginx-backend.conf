# ---------------------------------------------------------------------------
# dropnsharee.arhamnatiq.com  (double "e")  ->  Laravel API
#
# Create the site in the panel with root:
#     /www/wwwroot/Drop-and-Share/backend
# then set the site's "Run directory" / "运行目录" to  /public
# (that makes the effective document root .../backend/public).
#
# PHP version: 8.4
# ---------------------------------------------------------------------------

root /www/wwwroot/Drop-and-Share/backend/public;
index index.php;

# Must be >= post_max_size in .user.ini (550M), or nginx rejects big uploads
# with a 413 before PHP is ever reached.
client_max_body_size 550M;
client_body_timeout 600s;
client_body_buffer_size 1M;

# Laravel front controller
location / {
    try_files $uri $uri/ /index.php?$query_string;
}

location ~ \.php$ {
    try_files $uri =404;
    fastcgi_pass unix:/tmp/php-cgi-84.sock;
    fastcgi_index index.php;
    include fastcgi.conf;
    include pathinfo.conf;

    # Zipping and streaming large archives takes a while.
    fastcgi_read_timeout 600s;
    fastcgi_send_timeout 600s;

    # The download endpoint streams; don't let nginx buffer the whole zip
    # to disk first. The app also sends X-Accel-Buffering: no.
    fastcgi_buffering off;
}

# Never serve dotfiles (.env, .user.ini, .git) - except ACME challenges.
location ~ /\.(?!well-known) {
    deny all;
    return 404;
}

# The sqlite database must never be reachable over HTTP. (The zip archives
# live in storage/app/private/, which is outside the document root already.)
location ~* ^/(database|storage/private)/ {
    deny all;
    return 404;
}
