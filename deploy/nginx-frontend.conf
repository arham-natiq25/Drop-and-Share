# ---------------------------------------------------------------------------
# dropnshare.arhamnatiq.com  (single "e")  ->  Vue SPA
#
# Create the site in the panel first, then set the site's document root to:
#     /www/wwwroot/Drop-and-Share/frontend/dist
# and paste the two blocks below into the site's nginx config (or add the
# rewrite via the panel's "Rewrite" tab).
#
# The SPA owns its own routing, so any path that is not a real file has to
# fall through to index.html - otherwise /download/<uuid>.zip returns 404.
# ---------------------------------------------------------------------------

root /www/wwwroot/Drop-and-Share/frontend/dist;
index index.html;

# SPA fallback
location / {
    try_files $uri $uri/ /index.html;
}

# Vite writes content-hashed filenames, so these can be cached hard.
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
}

# index.html must never be cached, or users keep booting an old build.
location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
}

location ~ /\.(?!well-known) {
    deny all;
}
